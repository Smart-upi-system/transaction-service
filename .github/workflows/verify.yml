name: Transaction Service CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'transaction-service/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'transaction-service/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./transaction-service/transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify with Maven
        run: mvn -B verify --file pom.xml

      - name: Upload JAR artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: transaction-service-jar
          path: transaction-service/transaction-service/target/*.jar
          retention-days: 1

  build-and-push:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./transaction-service/transaction-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: transaction-service-jar
          path: transaction-service/transaction-service/target

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./transaction-service/transaction-service
          push: true
          tags: |
            darshthakur/transaction-service:latest
            darshthakur/transaction-service:${{ github.sha }}
          build-args: |
            # Adjust if your JAR name differs
            JAR_FILE=target/transaction-service-0.0.1-SNAPSHOT.jar