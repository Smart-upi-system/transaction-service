spring.application.name=transaction-service
server.port=4003


spring.datasource.url=jdbc:postgresql://localhost:5435/transaction_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.non-secure-port=${server.port}
#eureka.instance.secure-port-enabled=false
#eureka.instance.ip-address=127.0.0.1
eureka.instance.appname=${spring.application.name}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:yourRedisPassword}


spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.topics.transaction-events=transaction.events
spring.kafka.topics.fraud-requests=fraud.requests
spring.kafka.topics.fraud-results=fraud.results
#spring.kafka.topics.wallet-events=wallet.events
spring.kafka.topics.wallet-debit=wallet.debited
spring.kafka.topics.wallet-credit=wallet.credited
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.admin.auto-create=true

#spring.kafka.consumer.fraud-pass.group-id=transaction-service-fraud-pass-group
#spring.kafka.consumer.fraud-fail.group-id=transaction-service-fraud-fail-group
spring.kafka.consumer.fraud.group-id=transaction-service-fraud-group
spring.kafka.consumer.wallet-debit.group-id=transaction-service-wallet-debit-group
spring.kafka.consumer.wallet-credit.group-id=transaction-service-wallet-credit-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

grpc.server.port=9093
grpc.client.user-service.address=static://${USER_GRPC_HOST:localhost}:${USER_GRPC_PORT:9082}
#grpc.client.user-service.address=static://localhost:9082
grpc.client.user-service.negotiationType=PLAINTEXT
grpc.client.wallet.address=static://${WALLET_GRPC_HOST:wallet-service}:${WALLET_GRPC_PORT:9091}
#grpc.client.wallet.address=static://localhost:9091
grpc.client.wallet.negotiationType=PLAINTEXT


jwt.secret=${JWT_SECRET:BGiBX8GENIcKINk+z2A75yW5FeeGZWDNUdEODj0HHrE=}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# Actuator Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Levels
logging.level.root=INFO
logging.level.com.wallet.user=DEBUG
logging.level.org.springframework.kafka=info

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n