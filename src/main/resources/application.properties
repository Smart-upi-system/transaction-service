spring.application.name=transaction-service
server.port=4003


spring.datasource.url=jdbc:postgresql://localhost:5435/transaction_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.data.redis.host=localhost
spring.data.redis.port=6379


#kafka.topics.user-events=user.events
spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.consumer.group-id=user-profile
#spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
#spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

#grpc.server.port=9082


# Actuator Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Levels
logging.level.root=INFO
logging.level.com.wallet.user=DEBUG
logging.level.org.springframework.kafka=DEBUG

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n