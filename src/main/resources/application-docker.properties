spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/transaction_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:yourRedisPassword}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.hostname=transaction-service
eureka.instance.prefer-ip-address=true
grpc.client.user-service.address=static://${USER_GRPC_HOST:user-service}:${USER_GRPC_PORT:9082}
grpc.client.wallet.address=static://${WALLET_GRPC_HOST:wallet-service}:${WALLET_GRPC_PORT:9091}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:4001}
